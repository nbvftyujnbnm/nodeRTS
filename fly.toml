# Fly.io config. Deploy with:
#   fly launch --no-deploy --copy-config    (once, to pick a unique app name)
#   fly deploy --ha=false
#
# --ha=false matters: rooms are in-memory, so exactly one machine must serve
# them. Two machines would mean two disconnected sets of rooms.
app = "node-rts"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
