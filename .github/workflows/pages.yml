# Publishes the client to GitHub Pages.
#
# By default this ships a peer-to-peer build: one player's browser hosts the
# match over WebRTC, so the game is fully playable from the Pages URL with no
# server and no hosting cost at all.
#
# Optional repo variables (Settings > Secrets and variables > Actions > Variables):
#   SERVER_URL   URL of a game server. Setting it adds a "Server" option to the
#                menu alongside peer-to-peer. Remember to put your Pages origin
#                in that server's ALLOWED_ORIGINS.
#   ICE_SERVERS  JSON array of RTCIceServer entries, for a TURN server. Only
#                needed for players behind a NAT that blocks direct connections.
name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:client
        env:
          # Project sites live under /<repo>/, so the bundle needs that base.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_DEFAULT_MODE: p2p
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
          # With no server configured, hide the option instead of offering a
          # button that cannot work.
          VITE_P2P_ONLY: ${{ vars.SERVER_URL == '' && '1' || '' }}
          VITE_ICE_SERVERS: ${{ vars.ICE_SERVERS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
